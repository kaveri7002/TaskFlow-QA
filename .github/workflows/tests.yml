name: TaskFlow QA checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
          POSTGRES_DB: taskflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: browser-actions/setup-chrome@v1
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium firefox webkit
      - name: Run backend, Selenium, and Playwright tests
        run: pytest --alluredir=allure-results
        env:
          SECRET_KEY: taskflow-ci-only-test-secret
          DATABASE_URL: postgresql://taskflow:taskflow@localhost:5432/taskflow_test
          FRONTEND_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
          TASKFLOW_BROWSERS: chromium,firefox,webkit
      - name: Upload test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskflow-test-results
          path: |
            reports/
            screenshots/
            allure-results/
